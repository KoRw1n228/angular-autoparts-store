<div class="cart-container">
  <h2>🛒 Ваш кошик</h2>

  @if (items.length > 0) {
    <div class="cart-list">
      @for (item of items; track item.id) {
        <div class="cart-item">
          <span>{{ item.name }}</span>
          <span class="price">{{ item.price }} грн</span>
        </div>
      }
      <hr>
      <div class="total">
        <h3>Разом: {{ total }} грн</h3>
        <button (click)="checkout()" class="checkout-btn">Оформити замовлення</button>
      </div>
    </div>
  } @else {
    <p>Кошик порожній. Перейдіть в каталог, щоб обрати товари.</p>
    <a href="/" class="back-link">Повернутися в магазин</a>
  }
</div>
